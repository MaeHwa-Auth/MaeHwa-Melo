<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#11110f" />
    <title>MaeHwa Melo</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #0d0d0c; }

      /* 인트로 화면이 떠 있을 때 전체 커스텀 스크롤바 강제 숨김 */
      body.has-intro .custom-scrollbar,
      body.has-intro .custom-scrollbar-thumb,
      .custom-scrollbar,
      .custom-scrollbar-thumb {
        display: none !important;
        opacity: 0 !important;
        visibility: hidden !important;
      }
      body.intro-finished .custom-scrollbar,
      body.intro-finished .custom-scrollbar-thumb {
        display: block !important;
        opacity: 1 !important;
        visibility: visible !important;
      }

      /* ━━━━━━━━━━━━━━━━━━━━━━━━
         인트로 오버레이
      ━━━━━━━━━━━━━━━━━━━━━━━━ */
      #intro-screen {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #0d0d0c;
        overflow: hidden;
        transition: opacity .6s cubic-bezier(.4,0,.2,1);
      }
      #intro-screen.intro-done   { opacity: 0; pointer-events: none; }
      #intro-screen.intro-hidden { display: none !important; }

      /* ━━ 중앙 콘텐츠 블록 ━━ */
      .intro-center {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0;
        animation: intro-rise .75s cubic-bezier(.22,.61,.36,1) both;
      }
      @keyframes intro-rise {
        from { opacity: 0; transform: translateY(18px); }
        to   { opacity: 1; transform: translateY(0); }
      }

      /* 로고 PNG */
      .intro-logo {
        width: 140px;
        height: 140px;
        object-fit: contain;
        display: block;
        margin-bottom: 24px;
        filter: drop-shadow(0 0 24px rgba(255,255,255,.07));
        -webkit-user-drag: none;
      }

      /* 앱 이름 */
      .intro-title {
        font-family: Manrope, 'Noto Sans KR', system-ui, sans-serif;
        font-size: 46px;
        font-weight: 700;
        letter-spacing: -1px;
        line-height: 1;
        color: #f0ece4;
        margin: 0;
      }
      .intro-title-melo {
        color: #a09a91;
        font-weight: 400;
      }

      /* 타이틀 ↔ 로딩바 사이 간격 전담 래퍼 */
      .intro-bar-wrap {
        margin-top: 54px;
        width: 240px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      /* 로딩 바 */
      .intro-loading-bar {
        width: 100%;
        height: 3px;
        background: rgba(255,255,255,.12);
        border-radius: 3px;
        overflow: hidden;
      }
      .intro-loading-fill {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, rgba(255,255,255,.2) 0%, rgba(255,255,255,.85) 52%, rgba(255,255,255,.2) 100%);
        border-radius: 3px;
        animation: intro-load 2s cubic-bezier(.4,0,.2,1) .2s forwards;
      }
      @keyframes intro-load {
        0%   { width: 0%; }
        50%  { width: 68%; }
        80%  { width: 88%; }
        100% { width: 100%; }
      }

      /* 로딩 상태 텍스트 (로딩바 아래) */
      .intro-status-text {
        margin-top: 14px;
        font-family: Manrope, 'Noto Sans KR', system-ui, sans-serif;
        font-size: 13px;
        font-weight: 500;
        letter-spacing: .02em;
        color: #8c8880;
        text-align: center;
        min-height: 18px;
        line-height: 1.4;
        transition: color .2s ease;
      }

      /* ━━ 하단 고정 푸터 ━━ */
      .intro-footer {
        position: absolute;
        bottom: 34px;
        left: 0;
        right: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        animation: intro-rise .75s cubic-bezier(.22,.61,.36,1) .15s both;
      }

      /* Powered by Spotify */
      .intro-spotify {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .intro-spotify-icon {
        width: 22px;
        height: 22px;
        display: block;
        flex-shrink: 0;
        color: #7a7770;
      }
      .intro-spotify-text {
        font-family: Manrope, 'Noto Sans KR', system-ui, sans-serif;
        font-size: 14px;
        font-weight: 500;
        letter-spacing: .02em;
        color: #6b6860;
      }

      /* Provided by MaeHwa Studio */
      .intro-provided {
        font-family: Manrope, 'Noto Sans KR', system-ui, sans-serif;
        font-size: 13px;
        font-weight: 500;
        letter-spacing: .12em;
        text-transform: uppercase;
        color: rgba(255,255,255,.24);
      }

      /* ━━ 구석 상표 텍스트 (좌하단) ━━ */
      .intro-trademark {
        position: absolute;
        bottom: 22px;
        left: 24px;
        font-family: Manrope, 'Noto Sans KR', system-ui, sans-serif;
        font-size: 11px;
        font-weight: 400;
        letter-spacing: .04em;
        color: rgba(255,255,255,.14);
        line-height: 1.6;
        animation: intro-rise .75s cubic-bezier(.22,.61,.36,1) .2s both;
      }
    </style>
  </head>
  <body class="has-intro">
    <!-- 인트로 로딩화면 -->
    <div id="intro-screen" aria-hidden="true">

      <!-- 중앙 -->
      <div class="intro-center">
        <img class="intro-logo" src="/maehwa-logo.png" alt="MaeHwa Melo" draggable="false" />
        <h1 class="intro-title">
          <span>MaeHwa</span><span class="intro-title-melo"> Melo</span>
        </h1>
        <div class="intro-bar-wrap">
          <div class="intro-loading-bar">
            <div class="intro-loading-fill"></div>
          </div>
          <!-- 로딩 진행 텍스트 -->
          <div id="intro-status" class="intro-status-text">라이브러리 초기화 중...</div>
        </div>
      </div>

      <!-- 하단 크레딧 (정중앙 하단) -->
      <div class="intro-footer">
        <div class="intro-spotify">
          <svg
  class="intro-spotify-icon"
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 16 16"
  fill="#7a7770"
  aria-label="Spotify"
  role="img"
>
  <path d="M8 0a8 8 0 1 0 0 16A8 8 0 0 0 8 0m3.669 11.538a.5.5 0 0 1-.686.165c-1.879-1.147-4.243-1.407-7.028-.77a.499.499 0 0 1-.222-.973c3.048-.696 5.662-.397 7.77.892a.5.5 0 0 1 .166.686m.979-2.178a.624.624 0 0 1-.858.205c-2.15-1.321-5.428-1.704-7.972-.932a.625.625 0 0 1-.362-1.194c2.905-.881 6.517-.454 8.986 1.063a.624.624 0 0 1 .206.858m.084-2.268C10.154 5.56 5.9 5.419 3.438 6.166a.748.748 0 1 1-.434-1.432c2.825-.857 7.523-.692 10.492 1.07a.747.747 0 0 1-.764 1.288"/>
</svg>
          <span class="intro-spotify-text">Powered by Spotify</span>
        </div>
        <p class="intro-provided">Provided by MaeHwa Studio</p>
      </div>

      <!-- 좌하단 상표 -->
      <div class="intro-trademark">
        매화™<br>MaeHwa™
      </div>

    </div>

    <!-- App -->
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
